<html lang="id">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f2f6fc;
            padding: 16px 12px 30px;
            color: #1a2639;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* header */
        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 16px 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.02);
            border: 1px solid #e6ecf5;
            margin-bottom: 20px;
        }
        .toolbar-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            margin-bottom: 12px;
        }
        .toolbar-top .title {
            font-weight: 700;
            font-size: 1.25rem;
            color: #0b2a4a;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar-top .title small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #5a6f8e;
            background: #eef3fa;
            padding: 2px 12px;
            border-radius: 30px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            width: 100%;
        }
        .search-box {
            flex: 1 1 200px;
            min-width: 150px;
            display: flex;
            align-items: center;
            background: #f0f4fa;
            border-radius: 40px;
            padding: 0 16px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .search-box:focus-within {
            background: white;
            border-color: #2a6bd6;
            box-shadow: 0 0 0 3px rgba(42,107,214,0.12);
        }
        .search-box span {
            color: #6f83a3;
            font-size: 1rem;
            margin-right: 8px;
        }
        .search-box input {
            border: none;
            background: transparent;
            padding: 11px 0;
            width: 100%;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box input::placeholder {
            color: #98abbf;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px;
        }
        .filter-select {
            background: #f0f4fa;
            border: 1px solid #d8e0ec;
            border-radius: 30px;
            padding: 8px 16px 8px 14px;
            font-size: 0.85rem;
            color: #1a2639;
            cursor: pointer;
            outline: none;
            max-width: 160px;
        }
        .filter-select:focus {
            border-color: #2a6bd6;
        }

        .btn {
            background: white;
            border: 1px solid #cfdae8;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1a2639;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            background: #f8fbfe;
        }
        .btn:hover {
            background: #e9eff7;
            border-color: #b0c0d6;
        }
        .btn-primary {
            background: #1a3d6d;
            border-color: #1a3d6d;
            color: white;
        }
        .btn-primary:hover {
            background: #0e2d50;
            border-color: #0e2d50;
        }
        .btn-download {
            background: #1a5c3a;
            border-color: #1a5c3a;
            color: white;
        }
        .btn-download:hover {
            background: #10422a;
            border-color: #10422a;
        }
        .btn-clear {
            background: transparent;
            border: none;
            color: #6a7e9e;
            font-size: 0.8rem;
            padding: 0 6px;
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .btn-clear:hover {
            color: #1a3d6d;
        }

        /* Toggle PPN */
        .ppn-toggle-group {
            display: inline-flex;
            background: #e8eef6;
            border-radius: 40px;
            padding: 3px;
            border: 1px solid #d2ddeb;
        }
        .ppn-toggle-group .toggle-btn {
            border: none;
            background: transparent;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: #3d5475;
        }
        .ppn-toggle-group .toggle-btn.active {
            background: white;
            color: #0b2a4a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .ppn-toggle-group .toggle-btn:first-child {
            border-radius: 30px 0 0 30px;
        }
        .ppn-toggle-group .toggle-btn:last-child {
            border-radius: 0 30px 30px 0;
        }
        .ppn-badge {
            font-size: 0.7rem;
            background: #dce6f2;
            padding: 1px 10px;
            border-radius: 30px;
            color: #1f3a62;
            margin-left: 4px;
        }

        /* table */
        .table-wrapper {
            background: white;
            border-radius: 20px;
            border: 1px solid #e6ecf5;
            overflow: hidden;
            padding: 0 4px 4px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.02);
        }
        .table-scroll {
            overflow-x: auto;
            padding: 0 4px;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 750px;
        }
        th {
            background: #f0f6fe;
            color: #1a314d;
            font-weight: 600;
            padding: 13px 8px;
            text-align: left;
            border-bottom: 2px solid #d7e1ef;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }
        td {
            padding: 11px 8px;
            border-bottom: 1px solid #eaeef6;
            vertical-align: middle;
            word-break: break-word;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .badge {
            display: inline-block;
            background: #eef3f9;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.65rem;
            font-weight: 500;
            color: #1f3a5e;
            max-width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .note-tag {
            background: #e6edf8;
            border-radius: 16px;
            padding: 0 12px;
            font-size: 0.7rem;
            color: #1f3a5e;
            display: inline-block;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .price-up { color: #c73b3b; font-weight: 600; }
        .price-down { color: #1f7b4d; font-weight: 600; }
        .price-equal { color: #7a7f8a; }
        .text-muted { color: #6f83a3; }

        /* pagination */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 16px 12px 6px;
            gap: 12px;
            font-size: 0.85rem;
            border-top: 1px solid #e2e9f2;
            background: #fafcff;
            border-radius: 0 0 20px 20px;
        }
        .pagination .info {
            color: #435571;
        }
        .pagination .pages {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .pagination .page-btn {
            background: white;
            border: 1px solid #d4deec;
            border-radius: 30px;
            padding: 5px 13px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .pagination .page-btn.active {
            background: #1a3d6d;
            border-color: #1a3d6d;
            color: white;
        }
        .pagination .page-btn:hover:not(.active) {
            background: #e9eff8;
        }
        .pagination .page-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .no-result {
            padding: 40px 10px;
            text-align: center;
            color: #6f83a3;
        }

        @media (max-width: 640px) {
            .toolbar-top .title {
                font-size: 1rem;
                width: 100%;
            }
            .controls .search-box {
                flex: 1 1 100%;
            }
            .filter-group {
                width: 100%;
                justify-content: flex-start;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.75rem;
            }
            .ppn-toggle-group .toggle-btn {
                padding: 5px 12px;
                font-size: 0.7rem;
            }
            th, td {
                padding: 8px 5px;
                font-size: 0.7rem;
            }
            .pagination {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .pagination .pages {
                justify-content: center;
            }
        }
    </style>
</head>

<div class="container" id="app">
    <div class="toolbar">
        <div class="toolbar-top">
            <div class="title">
                🏨 Mercure Material
                <small>Material List</small>
            </div>
        </div>
        <div class="controls">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Cari material, unit, note..." @input="filterData">
            </div>
            <div class="filter-group">
                <select id="noteFilter" class="filter-select" @change="filterData">
                    <option value="">Semua Note</option>
                    <option value="pilihan brand">pilihan brand</option>
                    <option value="sdg ditanyakan">sdg ditanyakan</option>
                    <option value="sdg dicari">sdg dicari</option>
                    <option value="Local">Local</option>
                    <option value="kuantiti besar">kuantiti besar</option>
                    <option value="Quadra">Quadra</option>
                    <option value="Ikad">Ikad</option>
                    <option value="Valentino gress">Valentino gress</option>
                </select>

                <!-- Toggle PPN Include / Exclude -->
                <div class="ppn-toggle-group" id="ppnToggleGroup">
                    <button class="toggle-btn active" data-ppn="exclude" @click="setPPN('exclude')">Exclude PPN</button>
                    <button class="toggle-btn" data-ppn="include" @click="setPPN('include')">Include PPN <span class="ppn-badge">11%</span></button>
                </div>

                <button class="btn btn-clear" @click="clearFilters">✕ Clear</button>
                <button class="btn btn-download" @click="downloadExcel">⬇ Excel</button>
            </div>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Material</th>
                        <th>Note</th>
                        <th>Unit</th>
                        <th>Vol</th>
                        <th>Harga Mercure</th>
                        <th>Harga GM</th>
                        <th>Perbandingan</th>
                        <th>Keterangan</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- rows -->
                </tbody>
            </table>
        </div>
        <div id="paginationWrapper" class="pagination">
            <div class="info" id="pageInfo">0 item</div>
            <div class="pages" id="pageButtons"></div>
        </div>
    </div>
</div>

    { no: 66, material: "(WPC.03) Wood Plastic Composite (WPC) Panel 200x28mm", note: "Natural Wood Matt Hairline Finish", unit: "m'", vol: "", priceMercure: 137931.034482759, priceGM: null, ukuran: "", keterangan: "pilihan brand : GRM Biowood, Kayu Asri, Duma" }
];

// ========= STATE =========
let state = {
    rows: [...rawRows],
    filtered: [],
    pageSize: 15,
    currentPage: 1,
    ppnMode: 'exclude', // 'exclude' atau 'include'
    search: '',
    noteFilter: '',
};

// DOM refs
const tbody = document.getElementById('tableBody');
const pageInfo = document.getElementById('pageInfo');
const pageButtons = document.getElementById('pageButtons');
const searchInput = document.getElementById('searchInput');
const noteFilter = document.getElementById('noteFilter');

// ========= HELPERS =========
function formatCurrency(val) {
    if (val === null || val === undefined || isNaN(val)) return '-';
    return 'Rp ' + Number(val).toLocaleString('id-ID');
}

function getPriceGM(row, ppnMode) {
    if (row.priceGM === null || row.priceGM === undefined) return null;
    if (ppnMode === 'include') {
        return row.priceGM * 1.11;
    }
    return row.priceGM;
}

function getPriceMercure(row, ppnMode) {
    if (row.priceMercure === null || row.priceMercure === undefined) return null;
    if (ppnMode === 'include') {
        return row.priceMercure * 1.11;
    }
    return row.priceMercure;
}

function getComparison(row, ppnMode) {
    const mercure = getPriceMercure(row, ppnMode);
    const gm = getPriceGM(row, ppnMode);
    if (mercure === null || gm === null) return { label: '-', cls: '' };
    const diff = gm - mercure;
    if (Math.abs(diff) < 0.01) return { label: 'Sama', cls: 'price-equal' };
    if (diff > 0) return { label: '▲ GM lebih mahal', cls: 'price-up' };
    return { label: '▼ GM lebih murah', cls: 'price-down' };
}

// ========= RENDER =========
function render() {
    // filter
    let filtered = [...state.rows];
    const s = state.search.trim().toLowerCase();
    if (s) {
        filtered = filtered.filter(r =>
            r.material.toLowerCase().includes(s) ||
            r.note.toLowerCase().includes(s) ||
            r.unit.toLowerCase().includes(s) ||
            (r.ukuran && r.ukuran.toLowerCase().includes(s)) ||
            (r.keterangan && r.keterangan.toLowerCase().includes(s))
        );
    }
    if (state.noteFilter) {
        filtered = filtered.filter(r => r.note.toLowerCase().includes(state.noteFilter.toLowerCase()));
    }
    state.filtered = filtered;

    const total = filtered.length;
    const pageSize = state.pageSize;
    const totalPages = Math.ceil(total / pageSize) || 1;
    let page = state.currentPage;
    if (page > totalPages) page = totalPages;
    if (page < 1) page = 1;
    state.currentPage = page;

    const start = (page - 1) * pageSize;
    const end = Math.min(start + pageSize, total);
    const pageData = filtered.slice(start, end);

    // build rows
    let html = '';
    if (pageData.length === 0) {
        html = `<tr><td colspan="9" class="no-result">Tidak ada material ditemukan.</td></tr>`;
    } else {
        pageData.forEach((row) => {
            const mercurePrice = getPriceMercure(row, state.ppnMode);
            const gmPrice = getPriceGM(row, state.ppnMode);
            const comp = getComparison(row, state.ppnMode);
            const volDisplay = row.vol || '-';
            const noteShort = row.note || '-';
            const ukuranDisplay = row.ukuran || '';

            html += `<tr>
                <td>${row.no}</td>
                <td><strong>${row.material}</strong>${ukuranDisplay ? '<br><span class="badge">'+ukuranDisplay+'</span>' : ''}</td>
                <td><span class="note-tag">${noteShort}</span></td>
                <td>${row.unit}</td>
                <td>${volDisplay}</td>
                <td>${formatCurrency(mercurePrice)}</td>
                <td>${formatCurrency(gmPrice)}</td>
                <td><span class="${comp.cls}">${comp.label}</span></td>
                <td style="max-width:140px; font-size:0.7rem; color:#2c405e;">${row.keterangan || ''}</td>
            </tr>`;
        });
    }
    tbody.innerHTML = html;

    // pagination info
    pageInfo.textContent = `Menampilkan ${total > 0 ? start+1 : 0} - ${end} dari ${total} item`;

    // page buttons
    let btnHtml = '';
    btnHtml += `<button class="page-btn" data-page="${page-1}" ${page<=1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
        btnHtml += `<button class="page-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`;
    }
    btnHtml += `<button class="page-btn" data-page="${page+1}" ${page>=totalPages?'disabled':''}>›</button>`;
    pageButtons.innerHTML = btnHtml;

    document.querySelectorAll('#pageButtons .page-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            const p = parseInt(this.dataset.page);
            if (!isNaN(p) && p >= 1 && p <= totalPages) {
                state.currentPage = p;
                render();
            }
        });
    });
}

// ========= EVENTS =========
function filterData() {
    state.search = searchInput.value;
    state.noteFilter = noteFilter.value;
    state.currentPage = 1;
    render();
}

function clearFilters() {
    searchInput.value = '';
    noteFilter.value = '';
    state.search = '';
    state.noteFilter = '';
    state.currentPage = 1;
    render();
}

function setPPN(mode) {
    state.ppnMode = mode;
    // update toggle buttons
    document.querySelectorAll('.ppn-toggle-group .toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.ppn === mode);
    });
    state.currentPage = 1;
    render();
}

// ========= DOWNLOAD EXCEL (CSV) =========
function downloadExcel() {
    const rows = state.filtered.length ? state.filtered : state.rows;
    let csv = "No,Material,Note,Unit,Vol,Harga Mercure,Harga GM,Perbandingan,Keterangan\n";
    rows.forEach(r => {
        const mercure = getPriceMercure(r, state.ppnMode);
        const gm = getPriceGM(r, state.ppnMode);
        const comp = getComparison(r, state.ppnMode);
        const noteClean = (r.note || '').replace(/,/g,';');
        const matClean = r.material.replace(/,/g,';');
        const ketClean = (r.keterangan || '').replace(/,/g,';');
        csv += `${r.no},"${matClean}","${noteClean}",${r.unit},${r.vol||''},${mercure!==null?mercure:''},${gm!==null?gm:''},"${comp.label}",${ketClean}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Mercure_Material_${state.ppnMode}_PPN_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
}

// ========= INIT =========
searchInput.addEventListener('input', filterData);
noteFilter.addEventListener('change', filterData);

// set default active toggle
document.querySelectorAll('.ppn-toggle-group .toggle-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        setPPN(this.dataset.ppn);
    });
});

render();
</script>
